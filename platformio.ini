; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run -t upload` flashes all four windows over OTA in one command.
; Each frameN env targets its window's IP; DMX address is auto-derived on the
; device from its mdnsName, so no per-device config edit or filesystem upload
; is needed — do a firmware-only OTA (`-t upload`, NOT `-t uploadfs`).
default_envs = wt32-eth01-frame1, wt32-eth01-frame2, wt32-eth01-frame3, wt32-eth01-frame4

# Applies to every environment below. This framework ships LittleFS (not SPIFFS),
# so the on-device filesystem (config.json) is LittleFS; `pio run -t uploadfs`
# builds a LittleFS image accordingly.
[env]
board_build.filesystem = littlefs

[env:wt32-eth01]
platform = espressif32
board = wt32-eth01
framework = arduino
lib_compat_mode = strict
lib_deps = 
	hideakitai/ArtNet@^0.8.0
	arduinogetstarted/ezButton@^1.0.6
	gin66/FastAccelStepper @ ^0.31.7
	mathieucarbou/MycilaWebSerial @ ^8.1.1
	bblanchon/ArduinoJson @ ^7.4.1
	https://github.com/idzard/ESPUI
	hideakitai/ArduinoOSC @ ^0.5.2
monitor_speed = 115200
upload_speed = 921600
build_flags = -DDEFAULT_MDNS=\"window4\" -DDEFAULT_IP=\"10.0.0.104\" -DDEFAULT_REVERSE0=true -DDEFAULT_REVERSE1=false
upload_protocol = espota
upload_port = 10.0.0.104

